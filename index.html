<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NovaSites — Build Your Universe on the Web</title>
<meta name="description" content="AI-powered website generator — describe your idea, watch AI agents build it live. Universe-themed, bilingual (हिंदी/English).">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪐</text></svg>">
<style>
  :root{
    --bg:#030308; --blue:#0b1230; --purple:#8b5cf6; --cyan:#22d3ee; --white:#eef1fa;
    --panel:rgba(255,255,255,.045); --panel2:rgba(255,255,255,.028); --line:rgba(255,255,255,.1);
    --dim:#93a0bc; --grad:linear-gradient(135deg,#8b5cf6,#22d3ee);
    --glow:0 0 22px rgba(139,92,246,.45);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg); color:var(--white); overflow-x:hidden; line-height:1.65; min-height:100vh;
    font-family:'Segoe UI',system-ui,-apple-system,'Noto Sans','Nirmala UI','Noto Sans Devanagari',sans-serif}
  [hidden]{display:none !important}
  #neb,#uni{position:fixed; inset:0; z-index:0; pointer-events:none}
  .btn{border:none; cursor:pointer; text-decoration:none; font-family:inherit; font-size:.95rem; font-weight:700; border-radius:12px; padding:12px 24px; transition:transform .2s, box-shadow .2s; display:inline-flex; align-items:center; gap:9px; justify-content:center}
  .btn.p{background:var(--grad); color:#fff; box-shadow:0 8px 30px rgba(139,92,246,.4)}
  .btn.p:hover{transform:translateY(-2px); box-shadow:0 12px 40px rgba(139,92,246,.55)}
  .btn.g{background:var(--panel); color:var(--white); border:1px solid var(--line)}
  .btn.g:hover{transform:translateY(-2px); border-color:rgba(255,255,255,.32)}
  .btn.sm{padding:8px 15px; font-size:.84rem; border-radius:10px}
  .btn:disabled{opacity:.45; cursor:not-allowed; transform:none !important}

  /* ================= LANDING ================= */
  #landing{position:relative; z-index:2}
  nav.lnav{position:fixed; top:0; left:0; right:0; z-index:50; backdrop-filter:blur(14px); background:rgba(3,3,8,.55); border-bottom:1px solid var(--line)}
  .navin{max-width:1150px; margin:auto; display:flex; align-items:center; gap:18px; padding:12px 22px}
  .brand{display:flex; align-items:center; gap:10px; font-weight:800; font-size:1.1rem; color:var(--white); text-decoration:none}
  .brand .bico{width:36px; height:36px; border-radius:11px; background:var(--grad); display:grid; place-items:center; font-size:1.05rem; box-shadow:var(--glow)}
  .navin .sp{flex:1}
  .navlinks{display:flex; gap:20px; align-items:center}
  .navlinks a{color:var(--dim); text-decoration:none; font-size:.9rem}
  .navlinks a:hover{color:#fff}
  @media(max-width:860px){.navlinks a{display:none}}
  .lsec{max-width:1150px; margin:auto; padding:84px 22px; position:relative}
  .hero1{min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding-top:120px}
  .pill{display:inline-flex; align-items:center; gap:8px; border:1px solid rgba(139,92,246,.5); background:rgba(139,92,246,.1); border-radius:999px; padding:7px 18px; font-size:.84rem; color:#c4b5fd}
  .pill::before{content:''; width:8px; height:8px; border-radius:50%; background:var(--cyan); box-shadow:0 0 12px var(--cyan); animation:pl 2s infinite}
  @keyframes pl{0%,100%{opacity:1}50%{opacity:.35}}
  h1.big{font-size:clamp(2.3rem,6vw,4.1rem); font-weight:850; line-height:1.13; margin:24px 0 16px; max-width:900px}
  h1.big em{font-style:normal; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent}
  .lsub{color:var(--dim); max-width:640px; font-size:1.08rem; line-height:1.75}
  .ctarow{display:flex; gap:14px; margin-top:34px; flex-wrap:wrap; justify-content:center}
  .gbtn{background:#fff; color:#1f2937; border:none; border-radius:12px; padding:12px 24px; font-weight:700; font-size:.95rem; cursor:pointer; display:inline-flex; align-items:center; gap:10px; font-family:inherit; transition:transform .2s, box-shadow .2s}
  .gbtn:hover{transform:translateY(-2px); box-shadow:0 10px 30px rgba(255,255,255,.2)}
  .kick{display:inline-block; font-size:.78rem; font-weight:800; letter-spacing:2.5px; text-transform:uppercase; background:var(--grad); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:10px}
  h2.sec{font-size:clamp(1.6rem,3.2vw,2.3rem); font-weight:800; margin-bottom:10px}
  .secsub{color:var(--dim); max-width:620px; margin-bottom:38px}
  .grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
  .grid4{display:grid; grid-template-columns:repeat(5,1fr); gap:14px}
  @media(max-width:900px){.grid3{grid-template-columns:1fr}.grid4{grid-template-columns:repeat(2,1fr)}}
  .gcard{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:22px; transition:transform .25s, border-color .25s, box-shadow .25s; backdrop-filter:blur(8px)}
  .gcard:hover{transform:translateY(-4px); border-color:rgba(139,92,246,.55); box-shadow:var(--glow)}
  .gcard .gi{font-size:1.7rem; margin-bottom:10px}
  .gcard h3{font-size:1rem; font-weight:800; margin-bottom:6px}
  .gcard p{color:var(--dim); font-size:.86rem}
  .steps{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; counter-reset:st}
  @media(max-width:900px){.steps{grid-template-columns:1fr 1fr}}
  .step{background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:20px; position:relative}
  .step::before{counter-increment:st; content:counter(st); position:absolute; top:-13px; inset-inline-start:16px; width:27px; height:27px; border-radius:50%; background:var(--grad); display:grid; place-items:center; font-size:.8rem; font-weight:800}
  .step h4{font-size:.94rem; margin:6px 0 5px}
  .step p{color:var(--dim); font-size:.82rem}
  .prices{display:grid; grid-template-columns:repeat(3,1fr); gap:16px}
  @media(max-width:900px){.prices{grid-template-columns:1fr}}
  .price{background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:24px; text-align:center}
  .price.hot{border-color:rgba(139,92,246,.65); box-shadow:var(--glow)}
  .price b{font-size:1.9rem; display:block; margin:8px 0}
  .price ul{list-style:none; color:var(--dim); font-size:.87rem; margin:14px 0; display:grid; gap:7px}
  details.faq{background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 20px; margin-bottom:10px}
  details.faq summary{cursor:pointer; font-weight:700; font-size:.95rem}
  details.faq p{color:var(--dim); font-size:.88rem; margin-top:10px}
  footer.lf{border-top:1px solid var(--line); padding:30px 20px; text-align:center; color:var(--dim); font-size:.85rem; position:relative; z-index:2}

  /* ================= GOOGLE MODAL ================= */
  .gmodal{position:fixed; inset:0; z-index:120; background:rgba(2,2,8,.7); backdrop-filter:blur(5px); display:flex; align-items:center; justify-content:center; padding:18px}
  .gcardm{width:min(94vw,400px); background:#fff; color:#202124; border-radius:16px; padding:34px 34px 28px; font-family:'Segoe UI',Roboto,Arial,sans-serif; position:relative; box-shadow:0 30px 90px rgba(0,0,0,.6)}
  .gx{position:absolute; top:12px; inset-inline-end:14px; background:none; border:none; font-size:1rem; color:#5f6368; cursor:pointer; width:30px; height:30px; border-radius:50%}
  .gx:hover{background:#f1f3f4}
  .glogo{display:flex; justify-content:center; margin-bottom:14px}
  .gcardm h3{text-align:center; font-size:1.3rem; font-weight:500; margin-bottom:4px}
  .gsub{text-align:center; color:#5f6368; font-size:.88rem; margin-bottom:22px}
  .gacct{display:flex; align-items:center; gap:13px; padding:11px 12px; border:1px solid #dadce0; border-radius:10px; cursor:pointer; margin-bottom:9px; transition:background .15s}
  .gacct:hover{background:#f8f9fa}
  .gav{width:34px; height:34px; border-radius:50%; background:var(--grad); color:#fff; display:grid; place-items:center; font-weight:700; font-size:.95rem; flex:none}
  .gacct .gn{font-size:.92rem; font-weight:600}
  .gacct .ge{font-size:.78rem; color:#5f6368}
  .ginp{width:100%; border:1px solid #dadce0; border-radius:9px; padding:11px 13px; font-size:.92rem; margin-bottom:10px; outline:none; font-family:inherit}
  .ginp:focus{border-color:#1a73e8}
  .gcont{width:100%; background:#1a73e8; color:#fff; border:none; border-radius:9px; padding:11px; font-size:.93rem; font-weight:600; cursor:pointer; font-family:inherit}
  .gcont:hover{background:#1765cc}
  .gnote{font-size:.72rem; color:#80868b; text-align:center; margin-top:16px; line-height:1.5}

  /* ================= DASHBOARD ================= */
  #dash{position:relative; z-index:2; min-height:100vh; display:flex; flex-direction:column}
  .dtop{display:flex; align-items:center; gap:12px; padding:10px 18px; border-bottom:1px solid var(--line); background:rgba(3,3,10,.7); backdrop-filter:blur(12px); position:sticky; top:0; z-index:40}
  .dtop .sp{flex:1}
  .uchip{display:flex; align-items:center; gap:9px; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:5px 13px 5px 6px; cursor:pointer}
  .uav{width:29px; height:29px; border-radius:50%; background:var(--grad); display:grid; place-items:center; font-size:.82rem; font-weight:800; color:#fff}
  .uchip .un{font-size:.86rem; font-weight:700}
  .uchip .ue{font-size:.7rem; color:var(--dim)}
  .icob{background:var(--panel); color:var(--white); border:1px solid var(--line); border-radius:999px; padding:7px 15px; font-size:.85rem; font-weight:700; cursor:pointer; font-family:inherit; white-space:nowrap}
  .icob:hover{border-color:var(--cyan)}
  .dmain{flex:1; display:grid; grid-template-columns:1fr 350px; gap:0; min-height:0}
  @media(max-width:980px){.dmain{grid-template-columns:1fr} .rpanel{border-inline-start:none !important; border-top:1px solid var(--line)}}

  /* left builder */
  .lpanel{display:flex; flex-direction:column; min-width:0; min-height:70vh}
  .ltools{display:flex; align-items:center; gap:8px; padding:10px 14px; border-bottom:1px solid var(--line); flex-wrap:wrap}
  .tabs2{display:flex; gap:6px}
  .tb{background:var(--panel2); border:1px solid var(--line); color:var(--dim); border-radius:9px; padding:7px 14px; font-size:.82rem; font-weight:700; cursor:pointer; font-family:inherit}
  .tb.on{background:var(--grad); color:#fff; border-color:transparent}
  .devs{display:flex; gap:5px; margin-inline-start:auto}
  .dv{background:var(--panel2); border:1px solid var(--line); color:var(--dim); border-radius:8px; padding:6px 11px; font-size:.8rem; cursor:pointer; font-family:inherit}
  .dv.on{color:#fff; border-color:var(--cyan); box-shadow:0 0 10px rgba(34,211,238,.3)}
  .stage{flex:1; position:relative; padding:14px; display:flex; align-items:stretch; justify-content:center; min-height:520px; background:
    linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
    background-size:34px 34px}
  .frameWrap{background:#0d0d18; border:1px solid var(--line); border-radius:14px; overflow:hidden; display:flex; flex-direction:column; width:100%; transition:width .4s; margin:auto; height:100%; min-height:520px; box-shadow:0 22px 70px rgba(0,0,0,.5)}
  .fhead{display:flex; gap:7px; padding:10px 14px; background:var(--panel2); border-bottom:1px solid var(--line); align-items:center}
  .fd{width:10px; height:10px; border-radius:50%}
  .furl{flex:1; background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:8px; font-size:.74rem; color:var(--dim); padding:4px 12px; margin-inline-start:6px}
  #frame{flex:1; border:none; background:#fff; width:100%}
  #codeBox,#consoleBox,#histBox{flex:1; overflow:auto; padding:16px 18px; font-family:'Cascadia Code',Consolas,monospace; font-size:.8rem; line-height:1.7; background:#0d0d18; white-space:pre-wrap; word-break:break-all}
  #codeBox .tg{color:#82aaff}#codeBox .st{color:#c3e88d}#codeBox .cm{color:#546e7a}
  #consoleBox .cl{display:block}
  #consoleBox .ok{color:#34d399}#consoleBox .inf{color:#93a0bc}#consoleBox .wr{color:#fbbf24}#consoleBox .ag{color:#22d3ee; font-weight:700}
  .histItem{display:flex; align-items:center; gap:10px; background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:10px 14px; margin-bottom:9px; font-family:'Segoe UI',sans-serif}
  .histItem .hp{flex:1; font-size:.84rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .histItem .ht{color:var(--dim); font-size:.72rem}
  /* build overlay */
  #buildOv{position:absolute; inset:14px; border-radius:14px; background:rgba(3,3,10,.82); backdrop-filter:blur(6px); z-index:5; display:flex; align-items:center; justify-content:center; padding:20px}
  .bsteps{width:min(92%,420px)}
  .bsteps h3{font-size:1.05rem; margin-bottom:16px; display:flex; align-items:center; gap:10px}
  .bstep{display:flex; align-items:center; gap:11px; padding:8px 4px; font-size:.88rem; color:var(--dim)}
  .bstep .bi{width:22px; height:22px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; font-size:.68rem; flex:none}
  .bstep.doing{color:#fff}
  .bstep.doing .bi{border-color:var(--cyan); box-shadow:0 0 10px rgba(34,211,238,.5)}
  .bstep.doing .bi::after{content:''; width:8px; height:8px; border-radius:50%; background:var(--cyan); animation:pl 1s infinite}
  .bstep.done{color:#c9d3ea}
  .bstep.done .bi{border-color:#34d399; background:rgba(52,211,153,.15)}
  .bstep.done .bi::after{content:'✓'; color:#34d399; font-weight:800}
  .lbar{margin-inline-start:auto; display:flex; gap:8px}

  /* right panel */
  .rpanel{border-inline-start:1px solid var(--line); padding:16px; display:flex; flex-direction:column; gap:14px; overflow-y:auto; max-height:calc(100vh - 55px)}
  .rpanel > *{flex-shrink:0}
  .rp h3{font-size:.95rem; font-weight:800; margin-bottom:8px; display:flex; align-items:center; gap:8px}
  #prompt{width:100%; background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:13px; padding:13px 15px; color:var(--white); font-size:.92rem; outline:none; font-family:inherit; resize:vertical; min-height:88px}
  #prompt:focus{border-color:var(--purple); box-shadow:0 0 14px rgba(139,92,246,.25)}
  .exrow{display:flex; flex-wrap:wrap; gap:7px; margin-top:9px}
  .ex{border:1px solid var(--line); background:var(--panel2); color:var(--dim); border-radius:999px; padding:4px 12px; font-size:.76rem; cursor:pointer; font-family:inherit}
  .ex:hover{color:#fff; border-color:var(--cyan)}
  .genrow{display:flex; gap:9px; margin-top:11px}
  .genrow .btn{flex:1}
  .agents{display:grid; gap:8px}
  .agent{display:flex; align-items:center; gap:11px; background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:9px 12px}
  .agent .aico{width:32px; height:32px; border-radius:10px; background:var(--panel2); border:1px solid var(--line); display:grid; place-items:center; font-size:1rem; flex:none}
  .agent .anm{font-size:.84rem; font-weight:700}
  .agent .arl{font-size:.7rem; color:var(--dim)}
  .agent .ast{margin-inline-start:auto; font-size:.68rem; font-weight:800; border-radius:999px; padding:3px 10px; background:var(--panel2); border:1px solid var(--line); color:var(--dim); white-space:nowrap}
  .agent.w .ast{color:#22d3ee; border-color:rgba(34,211,238,.5); box-shadow:0 0 10px rgba(34,211,238,.25); animation:pl 1.1s infinite}
  .agent.d .ast{color:#34d399; border-color:rgba(52,211,153,.45)}
  .qacts{display:flex; flex-wrap:wrap; gap:8px}
  .aip{background:var(--panel); border:1px solid var(--line); border-radius:13px; overflow:hidden}
  .aip summary{padding:11px 14px; cursor:pointer; font-weight:700; font-size:.85rem; display:flex; align-items:center; gap:9px; list-style:none}
  .aip summary::-webkit-details-marker{display:none}
  .sdot{width:9px; height:9px; border-radius:50%; background:#64748b}
  .sdot.on{background:#34d399; box-shadow:0 0 10px #34d399}
  .aipin{padding:0 14px 14px; display:grid; gap:9px}
  .aipin .note{font-size:.74rem; color:var(--dim); line-height:1.55}
  .fi3{width:100%; background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:10px; padding:9px 12px; color:var(--white); font-size:.85rem; outline:none; font-family:inherit}
  .kcard{width:min(94vw,430px); background:rgba(10,10,26,.97); border:1px solid var(--line); border-radius:20px; padding:26px; position:relative; color:var(--white); box-shadow:0 30px 90px rgba(0,0,0,.6), var(--glow)}
  .kcard h3{font-size:1.12rem; font-weight:800; margin-bottom:10px; display:flex; gap:10px; align-items:center}
  .kcard .note{font-size:.8rem; color:var(--dim); line-height:1.6; margin-bottom:14px}
  .kcard .fi3{margin-bottom:10px; padding:12px 14px; font-size:.92rem}
  .kx{position:absolute; top:12px; inset-inline-end:14px; background:var(--panel); border:1px solid var(--line); color:var(--dim); width:30px; height:30px; border-radius:50%; cursor:pointer}
  .kx:hover{color:#fff}

  /* ================= FLOATING CHAT ================= */
  #fab{position:fixed; bottom:26px; inset-inline-end:26px; z-index:90; width:62px; height:62px; border-radius:50%; border:none; cursor:pointer;
    background:var(--grad); color:#fff; font-size:1.65rem; display:grid; place-items:center;
    box-shadow:0 0 24px rgba(139,92,246,.65), 0 0 60px rgba(34,211,238,.3); transition:transform .2s; animation:fabf 3.5s ease-in-out infinite}
  #fab:hover{transform:scale(1.12) rotate(8deg)}
  @keyframes fabf{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  #fab .ndot{position:absolute; top:4px; inset-inline-end:5px; width:13px; height:13px; border-radius:50%; background:#f43f5e; border:2px solid var(--bg)}
  #chatPanel{position:fixed; top:0; bottom:0; inset-inline-end:0; z-index:95; width:min(94vw,390px); background:rgba(6,6,16,.96); backdrop-filter:blur(16px); border-inline-start:1px solid var(--line); display:flex; flex-direction:column; transform:translateX(110%); transition:transform .35s cubic-bezier(.2,.8,.2,1)}
  html[dir="rtl"] #chatPanel{transform:translateX(-110%)}
  #chatPanel.open{transform:translateX(0) !important}
  .chead{display:flex; align-items:center; gap:11px; padding:14px 16px; border-bottom:1px solid var(--line)}
  .chead .cavatar{width:36px; height:36px; border-radius:50%; background:var(--grad); display:grid; place-items:center; font-size:1.1rem; box-shadow:var(--glow)}
  .chead b{font-size:.95rem}
  .chead .cs{display:block; font-size:.7rem; color:#34d399}
  .chead .cx{margin-inline-start:auto; background:var(--panel); border:1px solid var(--line); color:var(--dim); width:30px; height:30px; border-radius:50%; cursor:pointer; font-size:.8rem}
  .cmsgs{flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:11px}
  .cm2{max-width:86%; padding:10px 14px; border-radius:14px; font-size:.88rem; line-height:1.6; white-space:pre-wrap; overflow-wrap:break-word}
  .cm2.u{align-self:flex-end; background:var(--grad); color:#fff; border-end-end-radius:4px}
  .cm2.b{align-self:flex-start; background:rgba(255,255,255,.06); border:1px solid var(--line); border-end-start-radius:4px}
  .cm2 .tag2{display:block; font-size:.64rem; color:var(--cyan); margin-bottom:4px; font-weight:800; letter-spacing:.3px}
  .cm2.err{border-color:rgba(248,113,113,.5)} .cm2.err .tag2{color:#f87171}
  .tdots{display:inline-flex; gap:5px; padding:4px 0}
  .tdots i{width:7px; height:7px; border-radius:50%; background:var(--dim); animation:bk 1.2s infinite}
  .tdots i:nth-child(2){animation-delay:.2s}.tdots i:nth-child(3){animation-delay:.4s}
  @keyframes bk{0%,80%,100%{opacity:.25}40%{opacity:1}}
  .cin2row{display:flex; gap:9px; padding:13px; border-top:1px solid var(--line)}
  #cin2{flex:1; background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:12px; padding:11px 14px; color:var(--white); font-size:.9rem; outline:none; font-family:inherit; min-width:0}
  #cin2:focus{border-color:var(--purple)}
  .cchips{padding:0 13px 13px; display:flex; flex-wrap:wrap; gap:7px}
  .cchips .ex{font-size:.74rem}
  .cmsgs::-webkit-scrollbar,#codeBox::-webkit-scrollbar,#consoleBox::-webkit-scrollbar,.rpanel::-webkit-scrollbar{width:8px}
  .cmsgs::-webkit-scrollbar-thumb,#codeBox::-webkit-scrollbar-thumb,#consoleBox::-webkit-scrollbar-thumb,.rpanel::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12); border-radius:8px}
  @media (prefers-reduced-motion:reduce){ #fab,.pill::before{animation:none} }
</style>
</head>
<body>
<canvas id="neb"></canvas>
<canvas id="uni"></canvas>

<!-- ============ LANDING ============ -->
<div id="landing">
  <nav class="lnav"><div class="navin">
    <a class="brand" href="#top">🪐 NovaSites</a>
    <span class="sp"></span>

let aiKey = 'server', aiModel = 'claude-sonnet-5'; /* AI runs via /api/claude — key server par hai */
async function claudeAPI(payload, onDelta){
  if(onDelta){
    try{ return await claudeStream(payload, onDelta); }
    catch(e){ try{ clog('stream fallback: ' + e.message, 'wr'); }catch(_){} }
  }
  const res = await fetch('/api/claude', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(Object.assign({model:aiModel}, payload))});
  const data = await res.json().catch(() => ({}));
  if(!res.ok) throw new Error((data && data.error && data.error.message) || ('HTTP ' + res.status));
  return data;
}
async function claudeStream(payload, onDelta){
  const res = await fetch('/api/claude', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(Object.assign({model:aiModel, stream:true}, payload))});
  if(!res.ok){ const d = await res.json().catch(() => ({})); throw new Error((d && d.error && d.error.message) || ('HTTP ' + res.status)); }
  const ct = res.headers.get('content-type') || '';
  if(!ct.includes('event-stream')) return await res.json();
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '', full = '';
  while(true){
    const chunk = await reader.read();
    if(chunk.done) break;
    buf += dec.decode(chunk.value, {stream:true});
    const lines = buf.split('\n'); buf = lines.pop();
    for(const ln of lines){
      if(!ln.startsWith('data:')) continue;
      const js = ln.slice(5).trim();
      if(!js) continue;
      let ev = null; try{ ev = JSON.parse(js); }catch(e){ continue; }
      if(ev.type === 'content_block_delta' && ev.delta && ev.delta.text){ full += ev.delta.text; try{ onDelta(full); }catch(e){} }
      else if(ev.type === 'error') throw new Error((ev.error && ev.error.message) || 'stream error');
    }
  }
  if(!full.trim()) throw new Error('Empty AI response');
  return {content:[{type:'text', text: full}]};
}

/* ---------- universe background ---------- */
(function(){
  const cv = $('#neb'), ctx = cv.getContext('2d');
  function paint(){
    const dpr = Math.min(devicePixelRatio||1,2), W = innerWidth, H = innerHeight;
    cv.width = W*dpr; cv.height = H*dpr; cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
    let s = 7; const rnd = () => { s = (s*16807)%2147483647; return s/2147483647; };
    function blob(x,y,r,rgb,a){ const g = ctx.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,'rgba('+rgb+','+a+')'); g.addColorStop(1,'rgba('+rgb+',0)'); ctx.fillStyle = g; ctx.fillRect(x-r,y-r,r*2,r*2); }
    for(let i=0;i<8;i++) blob(rnd()*W, rnd()*H, 160+rnd()*260, '99,60,240', .05+rnd()*.05);
    for(let i=0;i<6;i++) blob(rnd()*W, rnd()*H, 140+rnd()*220, '11,40,120', .06+rnd()*.05);
    for(let i=0;i<4;i++) blob(rnd()*W, rnd()*H, 120+rnd()*180, '20,180,220', .03+rnd()*.03);
  }
  addEventListener('resize', paint); paint();
})();
(function(){
  const cv = $('#uni'), ctx = cv.getContext('2d');
  let W,H,stars=[],shots=[],gal=[],mx=0,my=0;
  function size(){
    const dpr = Math.min(devicePixelRatio||1,2);
    W = innerWidth; H = innerHeight;
    cv.width = W*dpr; cv.height = H*dpr; cv.style.width = W+'px'; cv.style.height = H+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);
    stars = []; gal = [];
    const n = Math.min(230, Math.floor(W*H/5200));
    for(let i=0;i<n;i++) stars.push({x:Math.random()*W, y:Math.random()*H, r:Math.random()*1.3+.3, b:Math.random()*.55+.2, p:Math.random()*6.28, s:Math.random()*.02+.005, L:Math.random()*2+1, c:Math.random()<.7?'#ffffff':(Math.random()<.5?'#cfe0ff':'#ffe3b8')});
    /* two slow galaxies (spiral particle rings) */
    for(let g=0; g<2; g++){
      const cx0 = (g? .82:.16)*W, cy0 = (g? .2:.72)*H, R = 60+g*30, pts = [];
      for(let i=0;i<110;i++){ const a = Math.random()*6.28, rr = Math.pow(Math.random(),.5)*R; pts.push({a, rr:rr*(1+.35*Math.sin(a*2)), sz:Math.random()*1.1+.3, al:.12+Math.random()*.3}); }
      gal.push({cx0, cy0, pts, rot:0, sp:(g? -.0009: .0007), hue:g?'34,211,238':'167,139,250'});
    }
  }
  addEventListener('resize', size); size();
  addEventListener('mousemove', e => { mx = e.clientX/W-.5; my = e.clientY/H-.5; });
  let nextShot = 200;
  (function frame(){
    ctx.clearRect(0,0,W,H);
    for(const g of gal){
      g.rot += g.sp;
      const gx = g.cx0 - mx*22, gy = g.cy0 - my*22;
      for(const p of g.pts){
        const a = p.a + g.rot;
        ctx.globalAlpha = p.al;
        ctx.fillStyle = 'rgba(' + g.hue + ',1)';
        ctx.beginPath(); ctx.arc(gx + Math.cos(a)*p.rr, gy + Math.sin(a)*p.rr*.45, p.sz, 0, 7); ctx.fill();
      }
    }
    for(const st of stars){
      st.p += st.s;
      ctx.globalAlpha = st.b*(0.55+0.45*Math.sin(st.p));
      ctx.fillStyle = st.c;
      ctx.beginPath(); ctx.arc(st.x - mx*16*st.L, st.y - my*16*st.L, st.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if(--nextShot <= 0){ nextShot = 260+Math.random()*420;
      shots.push({x:Math.random()*W*.8, y:Math.random()*H*.35, vx:7+Math.random()*5, vy:3+Math.random()*2.5, life:1}); }
    for(let i=shots.length-1;i>=0;i--){
      const sh = shots[i]; sh.x += sh.vx; sh.y += sh.vy; sh.life -= .022;
      if(sh.life <= 0){ shots.splice(i,1); continue; }
      const g2 = ctx.createLinearGradient(sh.x,sh.y,sh.x-sh.vx*9,sh.y-sh.vy*9);
      g2.addColorStop(0,'rgba(255,255,255,'+(.85*sh.life)+')'); g2.addColorStop(1,'rgba(255,255,255,0)');
      ctx.strokeStyle = g2; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(sh.x,sh.y); ctx.lineTo(sh.x-sh.vx*9, sh.y-sh.vy*9); ctx.stroke();
    }
    requestAnimationFrame(frame);
  })();
})();

  const t = T[lang], box = $('#gAccts'); box.innerHTML = '';
  let saved = [];
  try{ saved = JSON.parse(localStorage.getItem('nv-accts') || '[]'); }catch(e){}
  saved.slice(0,3).forEach(a => {
    const d = document.createElement('div');
    d.className = 'gacct';
    d.innerHTML = '<div class="gav"></div><div><div class="gn"></div><div class="ge"></div></div>';
    d.querySelector('.gav').textContent = (a.name[0]||'?').toUpperCase();
    d.querySelector('.gn').textContent = a.name;
    d.querySelector('.ge').textContent = a.email;
    d.addEventListener('click', () => finishSign(a));
    box.appendChild(d);
  });
  $('#gmodal').hidden = false;
  setTimeout(() => $('#gName').focus(), 80);
}
function finishSign(a){
  saveUser(a);
  try{
    let saved = JSON.parse(localStorage.getItem('nv-accts') || '[]');
    saved = [a].concat(saved.filter(x => x.email !== a.email)).slice(0,3);
    localStorage.setItem('nv-accts', JSON.stringify(saved));
  }catch(e){}
  $('#gmodal').hidden = true;
  refreshGate();
}
function refreshGate(){
  $('#landing').hidden = !!user;
  $('#dash').hidden = !user;
  document.body.style.overflow = '';
  if(user){
    $('#uav').textContent = (user.name[0]||'?').toUpperCase();
    $('#un').textContent = user.name;
    $('#ue').textContent = user.email;
    seedChat();
  }
}

/* ---------- tabs / devices ---------- */
function showTab(id){
  ['frame','codeBox','consoleBox','histBox'].forEach(x => { $('#'+x).hidden = (x !== id); });
  document.querySelectorAll('.tb').forEach(b => b.classList.toggle('on', b.dataset.tab === id));
  if(id === 'histBox') renderHist();
}

/* ---------- console log ---------- */
function clog(msg, cls, agent){
  const box = $('#consoleBox');
  const line = document.createElement('span');
  line.className = 'cl ' + (cls||'inf');
  const ts = new Date().toLocaleTimeString(lang==='hi'?'hi-IN':'en-IN',{hour12:false});
  line.innerHTML = '<span style="color:#546e7a">[' + ts + ']</span> ' + (agent ? '<span class="ag">' + agent + '</span> ' : '');
  line.appendChild(document.createTextNode(msg));
  box.appendChild(line);
  box.scrollTop = box.scrollHeight;
}

/* ---------- code view ---------- */
function esc2(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function renderCode(){
  let h = esc2(siteHTML);
  h = h.replace(/(&lt;\/?[a-zA-Z][^&]*?&gt;)/g, '<span class="tg">$1</span>');
  h = h.replace(/("(?:[^"\\]|\\.)*")/g, '<span class="st">$1</span>');
  $('#codeBox').innerHTML = h || '<span class="cm">// ' + T[lang].noSite + '</span>';
}

/* ---------- history ---------- */
function renderHist(){
  const box = $('#histBox'); box.innerHTML = '';
  if(!history.length){ box.innerHTML = '<p style="color:var(--dim);font-size:.86rem">' + T[lang].noHist + '</p>'; return; }
  history.forEach((h,i) => {
    const d = document.createElement('div');
    d.className = 'histItem';
    d.innerHTML = '<span>🕘</span><span class="hp"></span><span class="ht"></span><button class="icob" style="padding:5px 12px;font-size:.76rem"></button>';
    d.querySelector('.hp').textContent = 'v' + (i+1) + ' · ' + h.prompt.slice(0,60);
    d.querySelector('.ht').textContent = h.time;
    const b = d.querySelector('button'); b.textContent = T[lang].restore;
    b.addEventListener('click', () => { siteHTML = h.html; cfg = JSON.parse(JSON.stringify(h.cfg)); $('#frame').srcdoc = siteHTML; renderCode(); showTab('frame'); clog(T[lang].restored + ' v'+(i+1), 'ok'); });
    box.appendChild(d);
  });
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

function parsePrompt(p){
  const tk = p.toLowerCase();
  const hasAny = ws => ws.some(w => tk.includes(w));
  let type = 'business';
  if(hasAny(['portfolio','पोर्टफोलियो'])) type = 'portfolio';
  else if(hasAny(['restaurant','cafe','कैफे','कैफ़े','रेस्टोरेंट','रेस्तरां','chai','चाय','food','खाना','dhaba','ढाबा','hotel'])) type = 'restaurant';
  else if(hasAny(['shop','store','दुकान','dukan','दुकान','ecommerce','बेचन','कपड़','mobile shop'])) type = 'shop';
  else if(hasAny(['blog','ब्लॉग','news','न्यूज़'])) type = 'blog';
  else if(hasAny(['event','wedding','shaadi','शादी','birthday','जन्मदिन','invite','निमंत्रण','पार्टी','party'])) type = 'event';
  let accent = '#8b5cf6';
  for(const w in COLORS){ if(tk.includes(w)){ accent = COLORS[w]; break; } }
  const dark = !hasAny(['light theme','light mode','white theme','सफेद','light color','उजल']);
  let name = null;
  const qm = p.match(/["“']([^"”']{2,32})["”']/);
  if(qm) name = qm[1];
  else { const nm = p.match(/(?:naam|नाम|named|called)\s+([A-Za-z0-9ऀ-ॿ ]{2,26})/); if(nm) name = nm[1].trim(); }
  if(!name) name = (type === 'portfolio' || type === 'blog') && user ? user.name + (type==='blog' ? (lang==='hi'?' का ब्लॉग':"'s Blog") : '') : GENC[lang][type].name;
  const secMap = {
    portfolio:['hero','about','items','gallery','contact'],
    restaurant:['hero','about','items','gallery','contact'],
    shop:['hero','items','about','testi','contact'],
    blog:['hero','items','about','contact'],
    event:['hero','about','items','gallery','contact'],
    business:['hero','about','items','testi','contact']
  };
  return {type, accent, dark, name, anim:true, sections:secMap[type].slice(), lang};
}

function sitePart(c, sec){
  const L = GENC[lang], C = L[c.type], name = esc3(c.name);
  if(sec === 'nav') return '<div class="wrap"><nav><b>' + name + '</b><a href="#contact">' + L.contactT + '</a></nav></div>';
  if(sec === 'hero') return '<div class="wrap"><header><span class="badge">' + C.label + '</span><h1>' + name + '</h1><p class="tag">' + C.tag + '</p><a class="btn" href="#contact">' + C.cta + '</a></header></div>';
  if(sec === 'about') return '<div class="wrap"><section><h2>' + L.aboutT + '</h2><p class="ab">' + C.about + '</p></section></div>';
  if(sec === 'items'){
    if(c.type === 'portfolio') return '<div class="wrap"><section><h2>' + C.itemsTitle + '</h2><div class="chips">' + C.items.map(i => '<span class="chip">' + i + '</span>').join('') + '</div></section></div>';
    if(c.type === 'blog') return '<div class="wrap"><section><h2>' + C.itemsTitle + '</h2><div class="cards">' + C.items.map(i => '<div class="card"><b>' + i + '</b><p>' + L.readMore + '</p></div>').join('') + '</div></section></div>';
    return '<div class="wrap"><section><h2>' + C.itemsTitle + '</h2><div class="cards">' + C.items.map(i => { const m = i.split(/ - /); return '<div class="card"><b>' + m[0] + '</b>' + (m[1] ? '<span>' + m[1] + '</span>' : '') + '</div>'; }).join('') + '</div></section></div>';
  }
  if(sec === 'gallery') return '<div class="wrap"><section><h2>' + L.galleryT + '</h2><div class="gal">' + '<div class="gi2"></div>'.repeat(6) + '</div></section></div>';
  if(sec === 'testi') return '<div class="wrap"><section><h2>' + L.testiT + '</h2><div class="testi">' + L.testi.map(t => '<div class="tcard">"' + t.q + '"<b>' + t.a + '</b></div>').join('') + '</div></section></div>';
  if(sec === 'contact'){
    const em = user ? user.email : 'hello@example.com';
    return '<div class="wrap"><section id="contact"><h2>' + L.contactT + '</h2><form action="mailto:' + esc3(em) + '" method="post" enctype="text/plain">' +
      '<input name="name" placeholder="' + L.fName + '" required><input name="email" type="email" placeholder="' + L.fEmail + '" required>' +
      '<textarea name="message" rows="4" placeholder="' + L.fMsg + '"></textarea><button class="btn" type="submit" style="margin-top:4px">' + L.fSend + '</button></form></section></div>';
  }
  if(sec === 'footer') return '<div class="wrap"><footer>' + name + ' · ' + L.madeWith + '</footer></div>';
  return '';
}
function assemble(c){
  const parts = ['nav'].concat(c.sections).concat(['footer']).map(s => sitePart(c, s)).join('\n');
  return '<!DOCTYPE html>\n<html lang="' + lang + '">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>' + esc3(c.name) + '</title>\n<meta name="description" content="' + esc3(c.name) + ' — ' + GENC[lang][c.type].tag + '">\n<style>\n' + siteCSS(c) + '\n</style>\n</head>\n<body>\n' + parts + '\n</body>\n</html>';
}
function frameDoc(){ return $('#frame').contentDocument; }
function startDoc(c){

function addPart(html){
  try{
    const d = frameDoc(), div = d.createElement('div');
    div.innerHTML = html;
    while(div.firstChild) d.body.appendChild(div.firstChild);
    const last = d.body.lastElementChild; if(last) last.classList.add('nv-in');
  }catch(e){}
}

const ENGINE = {
  download(){
    if(!siteHTML) return;
    setAgent('deploy','w');
    const blob = new Blob([siteHTML], {type:'text/html'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = ((cfg ? cfg.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') : '') || 'my-site') + '.html';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => { URL.revokeObjectURL(a.href); setAgent('deploy','d'); }, 1500);
    clog(T[lang].dlLog, 'ok', T[lang].agDeploy);
  },
  rerender(){
    if(!cfg) return;
    siteHTML = assemble(cfg);
    $('#frame').srcdoc = siteHTML;
    renderCode();

  async liveGen(p){
    let lastPaint = 0, streamed = false;
    const onDelta = full => {
      $('#furl').textContent = '🧠 Claude likh raha hai… ' + full.length.toLocaleString() + ' chars';
      let doc = full; const fm = doc.match(/```(?:html)?\s*([\s\S]*)/); if(fm) doc = fm[1];
      if(!streamed && /<!DOCTYPE|<html/i.test(doc)){ streamed = true; $('#buildOv').hidden = true; clog('🧠 Claude AI live likh raha hai — preview dekhte raho!', 'inf'); }

      if(streamed && now - lastPaint > 1000){ lastPaint = now; $('#frame').srcdoc = doc; }
    };
    const data = await claudeAPI({max_tokens:12000,
        system:'You are the Frontend Developer agent of NovaSites, an AI website builder. Return ONLY a complete, valid, single-file HTML document (all CSS/JS inline). No markdown fences, no explanation. Modern, responsive, beautiful, with smooth animations. CRITICAL DESIGN RULES: choose colors, fonts and layout that FIT the requested business/topic (bakery = warm & cozy, gym = bold & energetic, law firm = classic & trustworthy, kids = playful...). NEVER default to a dark purple/blue space theme and NEVER imitate the NovaSites builder UI look. Every site must feel unique: vary hero style, section order, typography and color palette. Write visible text content in the same language as the user request.',

    let out = (data.content||[]).filter(b => b.type==='text').map(b => b.text).join('\n').trim();
    const fence = out.match(/```(?:html)?\s*([\s\S]*?)```/);
    if(fence) out = fence[1].trim();
    if(!/^<!DOCTYPE|^<html/i.test(out)) throw new Error('Invalid HTML from AI');
    return out;
  },
  async generate(regen){
    if(building) return;
    let p = $('#prompt').value.trim();
    if(!p && cfg) p = cfg.prompt;
    if(!p){ $('#prompt').focus(); $('#prompt').style.borderColor = '#f43f5e'; setTimeout(()=>{$('#prompt').style.borderColor='';},900); return; }
    building = true;
    ['genBtn','regenBtn','dlBtn','openBtn','copyBtn','qaSection','qaTheme','qaColor'].forEach(id => $('#'+id).disabled = true);
    showTab('frame'); resetAgents();
    const t = T[lang];
    /* build step list */
    const ov = $('#buildOv'), list = $('#bstepList'); list.innerHTML = '';
    t.bsteps.forEach(s => {
      const d = document.createElement('div');
      d.className = 'bstep';
      d.innerHTML = '<span class="bi"></span><span></span>';
      d.querySelector('span:last-child').textContent = s;
      list.appendChild(d);
    });
    ov.hidden = false;
    clog('▶ ' + t.genStart + ' "' + p.slice(0,70) + '"', 'inf');
    cfg = parsePrompt(p); cfg.prompt = p;
    let liveHTML = null, liveTried = false, liveErr = '';
    if(aiKey){
      liveTried = true;
      setAgent('planner','w'); list.children[0].classList.add('doing');
      clog(t.liveTry, 'inf', t.agPlanner);
      try{ liveHTML = await this.liveGen(p); clog(t.liveOk, 'ok', t.agFrontend); }
      catch(err){ liveErr = err.message; clog(t.liveFail + ' ' + err.message, 'wr'); this.chatBot('⚠️ ' + t.liveFailChat + '\n(' + err.message + ')', true); }
    }
    const AG = ['planner','designer','writer','frontend','frontend','frontend','animator','seo','mobile','debug'];
    for(let i=0; i<t.bsteps.length; i++){
      const row = list.children[i];
      row.classList.add('doing');
      const agid = AG[i];
      setAgent(agid, 'w');
      if(i === 8) setAgent('a11y','w');
      clog(t.blogs[i], i >= 8 ? 'ok' : 'inf', t['ag' + agid.charAt(0).toUpperCase() + agid.slice(1)]);
      /* offline progressive injection */
      if(!liveHTML){
        if(i === 3) startDoc(cfg), addPart(sitePart(cfg,'nav'));
        if(i === 4) addPart(sitePart(cfg,'hero'));
        if(i === 5){ for(const s of cfg.sections.slice(1)){ addPart(sitePart(cfg, s)); await sleep(340); } addPart(sitePart(cfg,'footer')); }
      } else if(i === 5){ $('#frame').srcdoc = liveHTML; }
      await sleep(i === 5 ? 500 : 480 + Math.random()*520);
      row.classList.remove('doing'); row.classList.add('done');
      setAgent(agid, 'd');
      if(i === 8) setAgent('a11y','d');
    }
    siteHTML = liveHTML || assemble(cfg);
    if(!liveHTML) $('#frame').srcdoc = siteHTML;
    renderCode();
    $('#furl').textContent = (liveHTML ? '🧠 claude-ai/' : '📦 demo-template/') + cfg.name.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');
    let warnEl = $('#aiWarn');
    if(!warnEl){ warnEl = document.createElement('div'); warnEl.id = 'aiWarn'; warnEl.style.cssText = 'display:none;background:linear-gradient(90deg,#7f1d1d,#991b1b);color:#fecaca;padding:12px 16px;border-radius:12px;margin:0 0 10px;font-size:.88rem;font-weight:600;border:1px solid #ef4444'; const fw = $('#frameWrap'); fw.parentNode.insertBefore(warnEl, fw); }
    if(liveTried && !liveHTML){
      warnEl.style.display = 'block';
      warnEl.textContent = (lang === 'hi' ? '⚠️ असली AI से connect नहीं हुआ — नीचे सिर्फ DEMO TEMPLATE है! वजह: ' : '⚠️ Could not reach the real AI — below is only the DEMO TEMPLATE! Reason: ') + liveErr;
    } else { warnEl.style.display = 'none'; }
    history.unshift({prompt:p, html:siteHTML, cfg:JSON.parse(JSON.stringify(cfg)), time:new Date().toLocaleTimeString(lang==='hi'?'hi-IN':'en-IN',{hour:'2-digit',minute:'2-digit'})});
    history = history.slice(0,6);
    clog('✔ ' + t.genDone + (liveHTML ? ' (Claude AI)' : ''), 'ok', t.agDebug);
    await sleep(450);
    ov.hidden = true;
    ['genBtn','regenBtn','dlBtn','openBtn','copyBtn','qaSection','qaTheme','qaColor'].forEach(id => $('#'+id).disabled = false);
    building = false;
    this.chatBot('✅ ' + t.chDone.replace('{n}', cfg.name));
  },
  quick(kind){
    if(!cfg || building) return;
    const t = T[lang];
    if(kind === 'section'){
      const pool = ['gallery','testi','about','contact'];
      const nxt = pool.find(s => !cfg.sections.includes(s));
      if(nxt){ cfg.sections.push(nxt); setAgent('frontend','w'); this.rerender(); setTimeout(()=>setAgent('frontend','d'),700); clog(t.qaAddLog, 'ok', t.agFrontend); }
      else this.chatBot(t.qaFull);
    }
    if(kind === 'theme'){ cfg.dark = !cfg.dark; setAgent('designer','w'); this.rerender(); setTimeout(()=>setAgent('designer','d'),700); clog(t.qaThemeLog, 'ok', t.agDesigner); }
    if(kind === 'color'){
      const cs = ['#8b5cf6','#3b82f6','#10b981','#ef4444','#f97316','#ec4899','#06b6d4','#f59e0b'];
      cfg.accent = cs[(cs.indexOf(cfg.accent)+1) % cs.length];
      setAgent('designer','w'); this.rerender(); setTimeout(()=>setAgent('designer','d'),700);
      clog(t.qaColorLog + ' ' + cfg.accent, 'ok', t.agDesigner);
    }
  },
  /* ---------- chat ---------- */
  addChat(text, who, tag, err){
    const box = $('#cmsgs');
    const m = document.createElement('div');
    m.className = 'cm2 ' + (who === 'u' ? 'u' : 'b') + (err ? ' err' : '');
    if(tag){ const s = document.createElement('span'); s.className = 'tag2'; s.textContent = tag; m.appendChild(s); }
    m.appendChild(document.createTextNode(text));
    box.appendChild(m);
    box.scrollTop = box.scrollHeight;
    return m;
  },
  chatBot(text, err){
    this.addChat(text, 'b', aiKey ? T[lang].modeLive : T[lang].modeOff, err);
    if(!$('#chatPanel').classList.contains('open')) $('#ndot').hidden = false;
  },
  async chatSend(){
    const inp = $('#cin2'), v = inp.value.trim();
    if(!v) return;
    inp.value = '';
    ENGINE.addChat(v, 'u');
    const typing = ENGINE.addChat('', 'b');
    typing.innerHTML = '<span class="tdots"><i></i><i></i><i></i></span>';
    const done = (txt, err) => { typing.remove(); ENGINE.chatBot(txt, err); };
    const t = T[lang], tk = v.toLowerCase();
    const hasAny = ws => ws.some(w => tk.includes(w));
    await sleep(420 + Math.random()*400);
    /* site edit commands (need a generated site) */
    let col = null; for(const w in COLORS){ if(tk.includes(w)){ col = COLORS[w]; break; } }
    if(cfg && col){ cfg.accent = col; ENGINE.rerender(); setAgent('designer','d'); return done('🎨 ' + t.cColor); }
    if(cfg && hasAny(['dark','डार्क'])){ cfg.dark = true; ENGINE.rerender(); return done('🌙 ' + t.cDark); }
    if(cfg && hasAny(['light','लाइट','सफेद'])){ cfg.dark = false; ENGINE.rerender(); return done('☀️ ' + t.cLight); }
    if(cfg && hasAny(['form','फॉर्म','फ़ॉर्म'])){ if(!cfg.sections.includes('contact')) cfg.sections.push('contact'); ENGINE.rerender(); return done('📮 ' + t.cForm); }
    if(cfg && hasAny(['gallery','गैलरी'])){ if(!cfg.sections.includes('gallery')) cfg.sections.push('gallery'); ENGINE.rerender(); return done('🖼️ ' + t.cGal); }
    if(cfg && hasAny(['testimonial','टेस्टिमोनियल','review'])){ if(!cfg.sections.includes('testi')) cfg.sections.push('testi'); ENGINE.rerender(); return done('⭐ ' + t.cTesti); }
    if(cfg && hasAny(['animation kam','reduce animation','एनीमेशन कम','कम एनीमेशन'])){ cfg.anim = false; ENGINE.rerender(); return done('🎞️ ' + t.cAnim); }
    if(cfg && hasAny(['professional','प्रोफेशनल'])){ cfg.accent = '#6366f1'; ENGINE.rerender(); return done('👔 ' + t.cProf); }
    if(cfg && hasAny(['publish','पब्लिश'])){ ENGINE.download(); return done('🚀 ' + t.cPub); }
    if(hasAny(['download','डाउनलोड'])){ if(siteHTML){ ENGINE.download(); return done('⬇️ ' + t.cDl); } return done(t.cNeed); }
    if(hasAny(['rebuild','dobara','दोबारा','regenerate','फिर से बना'])){ done(t.cRebuild); ENGINE.generate(true); return; }
    if(hasAny(['help','madad','मदद'])) return done('📖 ' + t.cHelp);
    if(hasAny(['hello','hi','namaste','नमस्ते','hey'])) return done('👋 ' + (user ? user.name + ', ' : '') + t.cHi);
    if(!cfg && (col || hasAny(['site','साइट','website','वेबसाइट','बना']))) return done('🏗️ ' + t.cNeed);
    /* live AI fallback */
    if(aiKey){
      try{
        chatHist.push({role:'user', content:v});
        const ctx = siteHTML ? ('CURRENT WEBSITE FULL HTML (user may ask you to modify it):\n```html\n' + siteHTML.slice(0, 60000) + '\n```') : 'No site generated yet.';
        const data = await claudeAPI({max_tokens: siteHTML ? 12000 : 4000,
            system:'You are Nova AI, the assistant inside NovaSites (an AI website builder made by Vedant Yadav with Claude). ' + ctx + ' Reply in the user\'s language, concisely. If the user asks for a completely new/changed website, include the full single-file HTML in a ```html code block. When modifying the current site, ALWAYS return the COMPLETE updated single-file HTML (never a fragment or diff), keep everything the user did not ask to change, and briefly say in words what you changed.',
            messages: chatHist.slice(-10)});
        let out = (data.content||[]).filter(b => b.type==='text').map(b => b.text).join('\n').trim();
        chatHist.push({role:'assistant', content:out});
        const fence = out.match(/```(?:html)?\s*([\s\S]*?)```/);
        if(fence && /<html|<!DOCTYPE/i.test(fence[1])){
          siteHTML = fence[1].trim();
          $('#frame').srcdoc = siteHTML; renderCode();
          $('#dlBtn').disabled = false; $('#openBtn').disabled = false; $('#copyBtn').disabled = false;
          out = out.replace(/```(?:html)?[\s\S]*?```/, '').trim() || t.cApplied;
          clog(t.cAppliedLog, 'ok', t.agFrontend);
        }
        return done(out);
      }catch(err){ return done('⚠️ ' + t.errLive + '\n(' + err.message + ')', true); }
    }
    return done('🤔 ' + t.cUnknown);
  }
};

window.addEventListener('DOMContentLoaded', () => {
  /* landing */
  $('#navSign').addEventListener('click', openG);
  $('#gSign').addEventListener('click', openG);
  $('#getStarted').addEventListener('click', openG);
  document.querySelectorAll('[data-goto]').forEach(b => b.addEventListener('click', openG));
  $('#gClose').addEventListener('click', () => { $('#gmodal').hidden = true; });
  $('#gmodal').addEventListener('click', e => { if(e.target === $('#gmodal')) $('#gmodal').hidden = true; });
  function gGo(){
    const n = $('#gName').value.trim();
    let em = $('#gEmail').value.trim();
    if(!n){ $('#gName').focus(); return; }
    if(!em) em = n.toLowerCase().replace(/\s+/g,'') + '@gmail.com';
    finishSign({name:n, email:em});
    $('#gName').value = ''; $('#gEmail').value = '';
  }
  $('#gGo').addEventListener('click', gGo);
  $('#gEmail').addEventListener('keydown', e => { if(e.key === 'Enter') gGo(); });
  $('#outBtn').addEventListener('click', () => { saveUser(null); refreshGate(); });

  /* lang */
  const flip = () => applyLang(lang === 'hi' ? 'en' : 'hi');
  $('#langL').addEventListener('click', flip);
  $('#langD').addEventListener('click', flip);

  /* tabs + devices */
  document.querySelectorAll('.tb').forEach(b => b.addEventListener('click', () => showTab(b.dataset.tab)));
  document.querySelectorAll('.dv').forEach(b => b.addEventListener('click', () => {
    document.querySelectorAll('.dv').forEach(x => x.classList.remove('on')); b.classList.add('on');
    $('#frameWrap').style.width = b.dataset.w;
  }));
  $('#fsBtn').addEventListener('click', () => {
    const fw = $('#frameWrap');
    if(document.fullscreenElement) document.exitFullscreen();
    else if(fw.requestFullscreen) fw.requestFullscreen();
  });
  $('#dlBtn').addEventListener('click', ENGINE.download);
  $('#openBtn').addEventListener('click', () => { if(!siteHTML) return; const u = URL.createObjectURL(new Blob([siteHTML], {type:'text/html'})); window.open(u, '_blank'); setTimeout(() => URL.revokeObjectURL(u), 60000); });
  $('#copyBtn').addEventListener('click', async () => { if(!siteHTML) return; try{ await navigator.clipboard.writeText(siteHTML); clog(lang === 'hi' ? 'कोड कॉपी हो गया ✔' : 'Code copied ✔', 'ok'); $('#copyBtn').textContent = '✔'; setTimeout(() => { $('#copyBtn').textContent = '⧉'; }, 1200); }catch(e){} });
  $('#prompt').addEventListener('keydown', e => { if((e.ctrlKey || e.metaKey) && e.key === 'Enter') ENGINE.generate(); });

  /* generator */
  $('#genBtn').addEventListener('click', () => ENGINE.generate(false));
  $('#regenBtn').addEventListener('click', () => ENGINE.generate(true));
  $('#qaSection').addEventListener('click', () => ENGINE.quick('section'));
  $('#qaTheme').addEventListener('click', () => ENGINE.quick('theme'));
  $('#qaColor').addEventListener('click', () => ENGINE.quick('color'));


  /* chat */
  $('#fab').addEventListener('click', () => { $('#chatPanel').classList.add('open'); $('#ndot').hidden = true; });
  $('#chatClose').addEventListener('click', () => $('#chatPanel').classList.remove('open'));
  $('#chatClear').addEventListener('click', () => { $('#cmsgs').innerHTML = ''; chatHist = []; seeded = false; seedChat(); });
  $('#csend2').addEventListener('click', ENGINE.chatSend);
  $('#cin2').addEventListener('keydown', e => { if(e.key === 'Enter') ENGINE.chatSend(); });

  refreshGate();
  applyLang(lang);
});

/* chat seed */
let seeded = false;
function seedChat(){
  if(seeded || !user) return; seeded = true;
  ENGINE.chatBot(T[lang].chSeed.replace('{n}', user.name));
}
function buildEx(){
  const box = $('#exRow'); if(!box) return; box.innerHTML = '';
  T[lang].examples.forEach(x => {
    const b = document.createElement('button');
    b.className = 'ex'; b.textContent = x;
    b.addEventListener('click', () => { $('#prompt').value = x; });
    box.appendChild(b);
  });
}
function buildChatChips(){
  const box = $('#cchips'); if(!box) return; box.innerHTML = '';
  T[lang].cchips.forEach(x => {
    const b = document.createElement('button');
    b.className = 'ex'; b.textContent = x;
    b.addEventListener('click', () => { $('#cin2').value = x; ENGINE.chatSend(); });
    box.appendChild(b);
  });
}
function buildAgentList(){
  const box = $('#agentList'); if(!box) return; box.innerHTML = '';
  AGENTS.forEach(a => {
    const d = document.createElement('div');
    d.className = 'agent'; d.id = 'ag-' + a.id;
    d.innerHTML = '<div class="aico">' + a.icon + '</div><div><div class="anm"></div><div class="arl"></div></div><span class="ast"></span>';
    d.querySelector('.anm').textContent = a[lang];
    d.querySelector('.arl').textContent = a['r_'+lang];
    d.querySelector('.ast').textContent = T[lang].stIdle;
    box.appendChild(d);
  });
}
function setAgent(id, state){
  const el = $('#ag-' + id); if(!el) return;
  el.className = 'agent' + (state === 'w' ? ' w' : state === 'd' ? ' d' : '');
  el.querySelector('.ast').textContent = state === 'w' ? T[lang].stWork : state === 'd' ? T[lang].stDone : T[lang].stIdle;
}
function resetAgents(){ AGENTS.forEach(a => setAgent(a.id, '')); }
